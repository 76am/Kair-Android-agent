<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="459" fill="none" stroke="#D0D7DE"/>

  <!-- Compose UI -->
  <rect x="140" y="24" width="680" height="62" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="480" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">Compose UI</text>
  <text x="480" y="70" text-anchor="middle" font-size="12.5" fill="#57606A">会话 · 面板 · 终端 · 浏览器 · 桌面</text>

  <line x1="480" y1="86" x2="480" y2="118" stroke="#8C959F" stroke-width="1.5"/>
  <polygon points="480,126 475,116 485,116" fill="#8C959F"/>
  <line x1="468" y1="118" x2="492" y2="118" stroke="#8C959F" stroke-width="1.5"/>

  <!-- Kernel -->
  <rect x="100" y="126" width="600" height="150" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="120" y="150" font-size="13" font-weight="600" fill="#4F46E5">内核（不可插件化）</text>

  <rect x="120" y="164" width="270" height="46" rx="8" fill="#ffffff" stroke="#D0D7DE"/>
  <text x="255" y="192" text-anchor="middle" font-size="13.5" fill="#1F2328">会话消息模型</text>

  <rect x="410" y="164" width="270" height="46" rx="8" fill="#ffffff" stroke="#D0D7DE"/>
  <text x="545" y="192" text-anchor="middle" font-size="13.5" fill="#1F2328">会话主循环</text>

  <rect x="120" y="218" width="270" height="46" rx="8" fill="#ffffff" stroke="#D0D7DE"/>
  <text x="255" y="246" text-anchor="middle" font-size="13.5" fill="#1F2328">插件宿主 · 注册表 + HookBus</text>

  <rect x="410" y="218" width="270" height="46" rx="8" fill="#ffffff" stroke="#D0D7DE"/>
  <text x="545" y="246" text-anchor="middle" font-size="13.5" fill="#1F2328">请求装配器 · 缓存稳定前缀</text>

  <!-- Plugins -->
  <rect x="720" y="126" width="200" height="150" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="740" y="150" font-size="13" font-weight="600" fill="#4F46E5">插件贡献点</text>
  <text x="740" y="176" font-size="12.5" fill="#1F2328">工具 · Provider 传输</text>
  <text x="740" y="198" font-size="12.5" fill="#1F2328">压缩 / 上下文策略</text>
  <text x="740" y="220" font-size="12.5" fill="#1F2328">系统提示 · 存储后端</text>
  <text x="740" y="242" font-size="12.5" fill="#1F2328">面板 · 命令 · 设置分区</text>
  <text x="740" y="264" font-size="12.5" fill="#57606A">独立编译 dex（ABI 兼容）</text>

  <line x1="704" y1="200" x2="716" y2="200" stroke="#8C959F" stroke-width="1.5"/>
  <polygon points="720,200 710,195 710,205" fill="#8C959F"/>
  <polygon points="700,200 710,195 710,205" fill="#8C959F"/>

  <line x1="400" y1="280" x2="400" y2="318" stroke="#8C959F" stroke-width="1.5"/>
  <polygon points="400,326 395,316 405,316" fill="#8C959F"/>

  <!-- Runtime -->
  <rect x="140" y="326" width="680" height="108" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="160" y="350" font-size="13" font-weight="600" fill="#4F46E5">运行时</text>
  <text x="160" y="376" font-size="12.5" fill="#1F2328">Android shell（toybox） · proot 容器（Ubuntu rootfs） · MCP 服务器（stdio / HTTP / SSE）</text>
  <text x="160" y="398" font-size="12.5" fill="#1F2328">WebView 常驻浏览器 · X11 图形桌面 · OpenAI 兼容 / Anthropic Messages</text>
  <text x="160" y="420" font-size="12" fill="#57606A">缓存前缀只追加：时间、临时状态与动态提示一律后置</text>
</svg>
