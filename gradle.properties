# 2026-11-17：容器把单进程地址空间限在 4GB（ulimit -v 4194304，硬限制不可调）、
# 进程+线程总数限 4096。默认 JVM 起不来：压缩指针模式把堆钉在**低 4GB**（hs_err 原话
# 「The Java Heap base address is the maximum limit for the native heap growth」），
# native 堆连 8MB 连续虚拟块都 mmap 不出，表现为「Could not allocate compressed class
# space」/ pthread EAGAIN。关压缩指针让堆挪出低 4GB；SerialGC 把 GC 并发线程与位图
# 预留降到最低；再收窄 code cache / metaspace。代价：引用 8 字节、GC 单线程偏慢 ——
# 换取 daemon 能活（系统 Committed_AS 已 34.5GB，高压力期启发式会拒新的大预留）。
org.gradle.jvmargs=-Xmx2048m -XX:+UseSerialGC -XX:-UseCompressedOops -XX:-UseCompressedClassPointers -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=320m -Xss1m -Dfile.encoding=UTF-8
# Kotlin 编译 daemon 是独立 JVM，同样受 4GB 限制，同款参数。
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseSerialGC -XX:-UseCompressedOops -XX:-UseCompressedClassPointers -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=320m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

systemProp.http.nonProxyHosts=localhost|127.0.0.1