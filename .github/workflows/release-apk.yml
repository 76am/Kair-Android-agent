name: Release APK

# 公开仓库的自动出包：推 v* 标签 → 构建 debug APK 并发布到 GitHub Releases；
# 手动触发（workflow_dispatch）→ 只产 artifact，不发版，避免造一堆 dev 标签。
#
# 签名用仓库内固定的 debug keystore（README §3/§6：只用于调试分发，不要上架）。
# 换 release 签名时再加 secrets，并把这里的 assembleDebug 换成 assembleRelease。

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # 与 ci.yml 同一份清单：默认列表里的 legacy `tools` 包已被移除，会直接挂。
          packages: 'platforms;android-35 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/34.0.0/aapt2

      - name: Name artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="dev-${GITHUB_RUN_NUMBER}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Kair-${tag}-debug.apk"
          sha256sum "dist/Kair-${tag}-debug.apk" > "dist/Kair-${tag}-debug.apk.sha256"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kair-${{ env.TAG }}-debug
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kair ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
